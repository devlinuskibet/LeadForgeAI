name: LeadForgeAI CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Test & Validate Backend (Python / FastAPI / pytest)
  # ─────────────────────────────────────────────────────────────
  test-backend:
    name: Backend CI (Tests & Lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies & Testing Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          python -m pytest tests/

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Test & Build Frontend (React / Vite / Vitest / TypeScript)
  # ─────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend CI (Vitest & Build Check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npm test

      - name: Validate TypeScript & Build Production Bundle
        run: |
          cd frontend
          npm run build

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Build & Publish Docker Containers to GitHub Packages (GHCR)
  # ─────────────────────────────────────────────────────────────
  publish-packages:
    name: Publish Docker Containers to GitHub Packages
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Repository Name for Docker Tagging
        run: |
          echo "IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend Image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}

      - name: Trigger Azure App Service Auto-Redeploy Webhook
        run: |
          curl -X POST "https://\$leadforge-backend-api:TgZrdsd92tYt965swL2huizCblMLbYAlREK6iRbtjarwSdurRzQkCb7ehwqg@leadforge-backend-api-cnb0hge5cyfpgwc7.scm.uaenorth-01.azurewebsites.net/api/registry/webhook"
